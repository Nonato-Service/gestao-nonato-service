# Configuração Nixpacks para Railway
# Build: 384 MB evita "Killed" no plano gratuito. Runtime: start-server.js sobe para 768 MB.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["export NODE_OPTIONS=--max-old-space-size=384 && npm run build"]

[start]
cmd = "npm start"
