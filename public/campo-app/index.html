<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <base href="/campo-app/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14532d" />
  <meta name="description" content="Nonato Campo — relatórios, serviços e despesas offline" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nonato Campo" />
  <link rel="icon" href="/campo-app/assets/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/campo-app/assets/icon-192.png" />
  <title>Nonato Campo</title>
  <link rel="manifest" href="/campo-app/manifest.json" />
  <link rel="stylesheet" href="/campo-app/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar__brand">
        <img id="topLogo" class="topbar__logo" src="" alt="" hidden />
        <div>
          <h1 class="topbar__title" id="topCompanyName">Nonato Service</h1>
          <p class="topbar__sub" id="topStatus">Nonato Campo · offline</p>
        </div>
      </div>
      <div class="topbar__actions">
        <label class="lang-picker">
          <span class="lang-picker__lbl" id="langLabel">Idioma</span>
          <select id="langSelect" class="lang-select" aria-label="Idioma">
            <option value="pt">PT</option>
            <option value="es">ES</option>
            <option value="it">IT</option>
          </select>
        </label>
      </div>
    </header>

    <nav class="tabs" id="navTabs">
      <button type="button" class="tabs__btn is-active" data-view="home">Início</button>
      <button type="button" class="tabs__btn" data-view="logo">Empresa</button>
      <button type="button" class="tabs__btn" data-view="servicos">Serviços</button>
      <button type="button" class="tabs__btn" data-view="relatorios">Relatórios</button>
      <button type="button" class="tabs__btn" data-view="despesas">Despesas</button>
    </nav>

    <main class="main" id="main"></main>
  </div>

  <dialog class="modal" id="modal">
    <form method="dialog" class="modal__inner" id="modalForm">
      <h3 class="modal__title" id="modalTitle">Título</h3>
      <div id="modalBody"></div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="modalCancel">Cancelar</button>
        <button type="submit" class="btn btn--primary" id="modalOk">OK</button>
      </div>
    </form>
  </dialog>

  <script src="/campo-app/js/db.js"></script>
  <script src="/campo-app/js/i18n.js"></script>
  <script src="/campo-app/js/utils.js"></script>
  <script src="/campo-app/js/pdf.js"></script>
  <script src="/campo-app/js/app.js"></script>
  <script>
    (function () {
      var BASE = "/campo-app/";
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register(BASE + "sw.js?v=7", { scope: BASE, updateViaCache: "none" }).then(function (reg) {
            reg.update();
            document.addEventListener("visibilitychange", function () {
              if (document.visibilityState === "visible") reg.update();
            });
            window.addEventListener("pageshow", function () { reg.update(); });
            var el = document.getElementById("topStatus");
            if (el && !navigator.onLine && window.NCampoI18n) el.textContent = NCampoI18n.t("statusOffline");
          }).catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
