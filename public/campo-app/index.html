<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <base href="/campo-app/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14532d" />
  <meta name="description" content="Nonato Campo — relatórios, serviços e despesas com gestor e permissões" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nonato Campo" />
  <link rel="icon" href="/campo-app/assets/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/campo-app/assets/icon-192.png" />
  <title>Nonato Campo</title>
  <link rel="manifest" href="/campo-app/manifest.json" />
  <link rel="stylesheet" href="/campo-app/styles.css?v=10" />
</head>
<body>
  <div id="loginScreen" class="login-screen" hidden>
    <div class="login-card">
      <h1 class="login-card__title">Nonato Campo</h1>
      <p class="login-card__sub" id="loginSub">Acesso para técnicos e gestor</p>
      <label class="label" for="loginUser" id="loginUserLabel">Utilizador</label>
      <input class="input" id="loginUser" autocomplete="username" />
      <label class="label" for="loginPass" id="loginPassLabel">Senha</label>
      <input class="input" id="loginPass" type="password" autocomplete="current-password" />
      <button type="button" class="btn btn--primary login-card__btn" id="btnLogin">Entrar</button>
      <p class="hint login-card__hint" id="loginHint">O gestor define quem acede e o que cada técnico pode ver.</p>
      <div id="bootstrapBox" class="panel panel--install" hidden>
        <h3 class="panel__title" id="bootstrapTitle">Primeira configuração local</h3>
        <p class="hint" id="bootstrapHint">Sem servidor, crie o gestor deste telemóvel.</p>
        <label class="label" for="bootName" id="bootNameLabel">Nome do gestor</label>
        <input class="input" id="bootName" value="Gestor" />
        <button type="button" class="btn btn--primary" id="btnBootstrap">Criar gestor local</button>
      </div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar__brand">
        <img id="topLogo" class="topbar__logo" src="" alt="" hidden />
        <div>
          <h1 class="topbar__title" id="topCompanyName">Nonato Service</h1>
          <p class="topbar__sub" id="topStatus">Nonato Campo · online</p>
        </div>
      </div>
      <div class="topbar__actions">
        <span class="user-chip" id="userChip" hidden></span>
        <button type="button" class="btn btn--sm btn--ghost" id="btnLogout" hidden>Sair</button>
        <div class="lang-picker" id="langPicker">
          <span class="lang-picker__lbl" id="langLabel">Idioma</span>
          <div class="lang-btns" role="group" aria-label="Idioma">
            <button type="button" class="lang-btn" data-lang="pt" aria-pressed="false">PT</button>
            <button type="button" class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
            <button type="button" class="lang-btn" data-lang="it" aria-pressed="false">IT</button>
          </div>
        </div>
      </div>
    </header>

    <nav class="tabs" id="navTabs">
      <button type="button" class="tabs__btn is-active" data-view="home">Início</button>
      <button type="button" class="tabs__btn" data-view="logo">Empresa</button>
      <button type="button" class="tabs__btn" data-view="servicos">Serviços</button>
      <button type="button" class="tabs__btn" data-view="relatorios">Relatórios</button>
      <button type="button" class="tabs__btn" data-view="despesas">Despesas</button>
      <button type="button" class="tabs__btn" data-view="gestao" hidden>Gestão</button>
    </nav>

    <main class="main" id="main"></main>
  </div>

  <dialog class="modal" id="modal">
    <form method="dialog" class="modal__inner" id="modalForm">
      <h3 class="modal__title" id="modalTitle">Título</h3>
      <div id="modalBody"></div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="modalCancel">Cancelar</button>
        <button type="submit" class="btn btn--primary" id="modalOk">OK</button>
      </div>
    </form>
  </dialog>

  <script src="/campo-app/js/db.js?v=10"></script>
  <script src="/campo-app/js/i18n.js?v=10"></script>
  <script src="/campo-app/js/utils.js?v=10"></script>
  <script src="/campo-app/js/auth.js?v=10"></script>
  <script src="/campo-app/js/gestao.js?v=10"></script>
  <script src="/campo-app/js/pdf.js?v=10"></script>
  <script src="/campo-app/js/app.js?v=10"></script>
  <script>
    (function () {
      var BASE = "/campo-app/";
      var VER = "10";
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register(BASE + "sw.js?v=" + VER, { scope: BASE, updateViaCache: "none" }).then(function (reg) {
            reg.update();
            document.addEventListener("visibilitychange", function () {
              if (document.visibilityState === "visible") reg.update();
            });
            window.addEventListener("pageshow", function () { reg.update(); });
            reg.addEventListener("updatefound", function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener("statechange", function () {
                if (nw.state === "installed" && navigator.serviceWorker.controller) {
                  var ok = confirm("Nova versão da app Campo disponível. Atualizar agora?");
                  if (ok) window.location.reload();
                }
              });
            });
          }).catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
