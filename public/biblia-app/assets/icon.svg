    <line x1="16" y1="52" x2="56" y2="52" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="76" x2="56" y2="76" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="100" x2="50" y2="100" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="124" x2="56" y2="124" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="148" x2="48" y2="148" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
