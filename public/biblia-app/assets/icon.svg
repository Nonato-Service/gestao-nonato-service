    <line x1="88" y1="76" x2="128" y2="76" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="88" y1="100" x2="122" y2="100" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="88" y1="124" x2="128" y2="124" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="88" y1="148" x2="120" y2="148" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 214 L72 214 L72 228 L0 228 Z" fill="#16a34a"/>
