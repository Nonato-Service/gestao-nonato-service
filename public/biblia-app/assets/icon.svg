    <rect x="28" y="0" width="118" height="228" rx="10" fill="url(#cover)" stroke="#86efac" stroke-width="4"/>
    <rect x="42" y="14" width="90" height="200" rx="6" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.45"/>
    <rect x="78" y="68" width="14" height="92" rx="4" fill="#fde68a"/>
    <rect x="58" y="104" width="54" height="14" rx="4" fill="#fde68a"/>
