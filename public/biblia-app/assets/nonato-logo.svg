<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" role="img" aria-label="NONATO SERVICE">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="4" y="10" width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Fundo + contorno -->
  <rect x="0" y="6" width="72" height="72" rx="16" fill="#0f1012"/>
  <rect x="0" y="6" width="72" height="72" rx="16" fill="none" stroke="url(#g)" stroke-width="2.8"/>

  <!-- Livros dentro do contorno -->
  <g clip-path="url(#iconClip)">
    <!-- Bíblia fechada -->
    <g transform="translate(9, 17)">
      <rect x="0" y="2" width="6" height="48" rx="1.5" fill="#14532d"/>
      <rect x="1" y="2" width="1.5" height="48" rx="0.8" fill="#22c55e" opacity="0.45"/>
      <rect x="6" y="0" width="26" height="50" rx="3.5" fill="url(#cover)" stroke="#86efac" stroke-width="1.1"/>
      <rect x="9.5" y="4" width="19" height="42" rx="2" fill="none" stroke="#4ade80" stroke-width="0.7" opacity="0.55"/>
      <rect x="16" y="14" width="2.8" height="18" rx="1" fill="#fde68a"/>
      <rect x="12.5" y="20" width="11" height="2.5" rx="1" fill="#fde68a"/>
      <rect x="30" y="4" width="2" height="42" rx="0.8" fill="#e2e8f0"/>
    </g>

    <!-- Bíblia aberta -->
    <g transform="translate(39, 17)">
      <path d="M14 2 C14 2 14 0 14 0 L14 50 L0 50 L0 7 Q7 2 14 2 Z" fill="url(#pageL)"/>
      <path d="M14 0 C14 0 14 2 14 2 C21 2 28 7 28 7 L28 50 L14 50 L14 0 Z" fill="url(#pageR)"/>
      <path d="M14 0 Q21 2.5 28 7 L14 7 Z" fill="#ecfdf5" opacity="0.9"/>
      <rect x="12" y="0" width="4" height="50" rx="1.2" fill="#14532d"/>
      <rect x="12.8" y="0" width="1.2" height="50" rx="0.6" fill="#22c55e" opacity="0.5"/>
      <line x1="3.5" y1="12" x2="10" y2="12" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="3.5" y1="17" x2="10" y2="17" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="3.5" y1="22" x2="9.5" y2="22" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="3.5" y1="27" x2="10" y2="27" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="18" y1="12" x2="24.5" y2="12" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="18" y1="17" x2="24.5" y2="17" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="18" y1="22" x2="24" y2="22" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="18" y1="27" x2="24.5" y2="27" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M0 46 L14 46 L14 50 L0 50 Z" fill="#16a34a"/>
      <path d="M14 46 L28 46 L28 50 L14 50 Z" fill="#15803d"/>
    </g>
  </g>

  <!-- Contorno por cima (livros não cortam a borda) -->
  <rect x="0" y="6" width="72" height="72" rx="16" fill="none" stroke="url(#g)" stroke-width="2.8" pointer-events="none"/>

  <text x="88" y="47" font-family="Segoe UI, system-ui, sans-serif" font-size="29" font-weight="800" fill="#ffffff">NONATO</text>
  <text x="88" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#4ade80" letter-spacing="0.38em">SERVICE</text>
</svg>
