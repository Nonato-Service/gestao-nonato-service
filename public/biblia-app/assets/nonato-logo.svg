    <line x1="4" y1="14" x2="12" y2="14" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="4" y1="20" x2="12" y2="20" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round"/>
