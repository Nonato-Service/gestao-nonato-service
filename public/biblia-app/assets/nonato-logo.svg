    <rect x="11" y="4" width="22" height="50" rx="2" fill="none" stroke="#4ade80" stroke-width="0.8" opacity="0.55"/>
    <rect x="19" y="16" width="3.2" height="22" rx="1.2" fill="#fde68a"/>
    <rect x="14" y="24" width="13" height="3" rx="1.2" fill="#fde68a"/>
