      <g transform="translate(14, 0)">
        <path d="M0 -17 L0 17 L-12 17 L-12 -2 Q-6 -17 0 -17 Z" fill="url(#pageL)"/>
        <path d="M0 -17 Q6 -17 12 -2 L12 17 L0 17 Z" fill="url(#pageR)"/>
        <path d="M0 -17 Q6 -15 12 -2 L0 -2 Z" fill="#ecfdf5" opacity="0.85"/>
        <rect x="-1.8" y="-17" width="3" height="34" rx="0.9" fill="#14532d"/>
        <line x1="-9.5" y1="-8" x2="-4.5" y2="-8" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <line x1="-9.5" y1="-3.5" x2="-4.5" y2="-3.5" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <line x1="-9.5" y1="1" x2="-5" y2="1" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <line x1="-9.5" y1="5.5" x2="-4.5" y2="5.5" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <line x1="3.5" y1="-8" x2="8.5" y2="-8" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <line x1="3.5" y1="-3.5" x2="8.5" y2="-3.5" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <line x1="3.5" y1="1" x2="8" y2="1" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <line x1="3.5" y1="5.5" x2="8.5" y2="5.5" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
        <path d="M-12 13 L0 13 L0 17 L-12 17 Z" fill="#16a34a"/>
        <path d="M0 13 L12 13 L12 17 L0 17 Z" fill="#15803d"/>
