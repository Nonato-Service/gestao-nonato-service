  </defs>

  <rect x="0" y="6" width="72" height="72" rx="16" fill="#0f1012"/>

  <g clip-path="url(#iconClip)">
    <g transform="translate(36, 42)">

      <!-- Bíblia fechada (margem esquerda ~12px do contorno) -->
      <g transform="translate(-14, 0)">
        <rect x="-10" y="-17" width="4" height="34" rx="1" fill="#14532d"/>
        <rect x="-6" y="-17" width="17" height="34" rx="2.5" fill="url(#cover)" stroke="#86efac" stroke-width="0.75"/>
        <rect x="-3.5" y="-13" width="12" height="26" rx="1.2" fill="none" stroke="#4ade80" stroke-width="0.5" opacity="0.5"/>
        <rect x="1.5" y="-5.5" width="1.8" height="11" rx="0.6" fill="#fde68a"/>
        <rect x="-1" y="-2" width="7" height="1.6" rx="0.6" fill="#fde68a"/>
        <rect x="9" y="-13" width="1.2" height="26" rx="0.4" fill="#e2e8f0"/>
      </g>

