<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar biblioteca completa — Nonato</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; background: #0f1419; color: #e8eef4; }
    h1 { font-size: 1.25rem; }
    #status { margin: 1rem 0; padding: 1rem; border-radius: 8px; background: #1a2332; line-height: 1.6; white-space: pre-wrap; }
    .ok { border: 1px solid #3d9a5a; }
    .err { border: 1px solid #c44; }
    a { color: #7dffb0; }
    .note { font-size: 0.9rem; opacity: 0.9; }
  </style>
</head>
<body>
  <h1>Recuperar biblioteca completa</h1>
  <p class="note">Os seus dados <strong>estão guardados neste PC</strong> (362 peças, 208 fotos). Esta página repõe tudo no browser — <strong>sem ir buscar ao site</strong>.</p>
  <div id="status">A iniciar…</div>
  <p><a href="/">← Voltar à aplicação</a></p>
  <script>
    (async function () {
      const el = document.getElementById('status');
      const KEY = 'nonato-pecas-biblioteca';
      const DB = 'nonato-gestao-tecnica-v1';
      const STORE = 'kv';

      function setMsg(text, ok) {
        el.textContent = text;
        el.className = ok ? 'ok' : 'err';
      }

      async function saveLocal(pecas) {
        try {
          localStorage.removeItem(KEY);
          localStorage.removeItem(KEY + '--idb');
          localStorage.setItem(KEY, JSON.stringify(pecas));
        } catch (e) {
          console.warn('localStorage', e);
        }
        if (typeof indexedDB === 'undefined') return;
        const db = await new Promise(function (resolve, reject) {
          const req = indexedDB.open(DB, 2);
          req.onerror = function () { reject(req.error); };
          req.onsuccess = function () { resolve(req.result); };
          req.onupgradeneeded = function () {
            const d = req.result;
            if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
          };
        });
        const safe = JSON.parse(JSON.stringify(pecas));
        await new Promise(function (resolve, reject) {
          const tx = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).put(safe, KEY);
          tx.oncomplete = resolve;
          tx.onerror = function () { reject(tx.error); };
        });
      }

      async function hydrateImages(pecas) {
        let total = 0;
        try {
          const metaRes = await fetch('/api/data/repair-pecas-biblioteca?meta=1', { cache: 'no-store' });
          if (metaRes.ok) {
            const meta = await metaRes.json();
            if (typeof meta.totalImages === 'number') total = meta.totalImages;
          }
        } catch (_) {}
        if (total <= 0) return pecas;

        const byId = new Map();
        for (const p of pecas) {
          if (p && p.id) byId.set(String(p.id), Object.assign({}, p));
        }

        let offset = 0;
        let loaded = 0;
        while (offset < total) {
          setMsg('Fotos do servidor: ' + loaded + ' / ' + total + '…\n(Não precisa ir ao site HOMAG.)', true);
          const res = await fetch('/api/data/repair-pecas-biblioteca?images=1&offset=' + offset + '&limit=1', { cache: 'no-store' });
          if (!res.ok) break;
          const json = await res.json();
          if (!json.success || !Array.isArray(json.imagens) || json.imagens.length === 0) break;
          if (typeof json.total === 'number') total = json.total;
          for (const row of json.imagens) {
            const peca = byId.get(String(row.id || ''));
            if (peca && row.imagem) {
              peca.imagem = row.imagem;
              delete peca.temImagemServidor;
            }
            loaded++;
          }
          offset += json.imagens.length;
          if (loaded % 10 === 0) await saveLocal(Array.from(byId.values()));
          if (!json.hasMore) break;
        }
        return Array.from(byId.values());
      }

      try {
        setMsg('A carregar catálogo do disco deste PC…');
        const res = await fetch('/api/data/pecas-fix?_=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('Servidor respondeu ' + res.status);
        const json = await res.json();
        let pecas = json && json.pecas;
        if (!json.success || !Array.isArray(pecas) || pecas.length < 50) {
          throw new Error('Catálogo inválido (' + (pecas ? pecas.length : 0) + ' peças).');
        }

        await saveLocal(pecas);
        pecas = await hydrateImages(pecas);
        await saveLocal(pecas);

        const comFoto = pecas.filter(function (p) { return p.imagem && String(p.imagem).indexOf('data:') === 0; }).length;
        setMsg(
          '✓ Concluído!\n\n' +
          pecas.length + ' peças\n' +
          comFoto + ' fotos recuperadas do servidor\n\n' +
          'NÃO precisa ir buscar nada ao site.\nA abrir a aplicação em 3 segundos…',
          true
        );
        setTimeout(function () { window.location.href = '/'; }, 3000);
      } catch (e) {
        setMsg('Erro: ' + (e && e.message ? e.message : String(e)), false);
      }
    })();
  </script>
</body>
</html>
